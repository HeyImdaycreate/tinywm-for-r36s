name: Compile TinyWM for R36S
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Configure Pure ARM64 Repositories
        run: |
          # 1. Активируем архитектуру arm64 в системе
          sudo dpkg --add-architecture arm64
          
          # 2. Полностью стираем старые списки и пишем ОДИН единственный репозиторий строго для ARM64 пакетов графики
          sudo tee /etc/apt/sources.list <<EOF
          deb [arch=arm64] http://ubuntu.com noble main universe restricted multiverse
          deb [arch=arm64] http://ubuntu.com noble-updates main universe restricted multiverse
          deb [arch=arm64] http://ubuntu.com noble-security main universe restricted multiverse
          EOF
          
          # 3. Обновляем кэш (теперь предупреждений W: configured multiple times не будет)
          sudo apt-get update
          
          # 4. Устанавливаем кросс-компилятор и статические библиотеки графики X11
          sudo apt-get install -y gcc-aarch64-linux-gnu libx11-dev:arm64

      - name: Compile pure static binary
        run: |
          # Собираем монолитный файл со всеми зашитыми зависимостями
          aarch64-linux-gnu-gcc tinywm.c -o tinywm_bin -static -O2 -lX11 -lxcb -lXau -lXdmcp
          
      - name: Upload compiled binary to GitHub Releases
        uses: actions/upload-artifact@v4
        with:
          name: tinywm-for-r36s
          path: tinywm_bin
