name: Compile TinyWM for R36S
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Add arm64 arch and configure split repos
        run: |
          sudo dpkg --add-architecture arm64

          sudo tee /etc/apt/sources.list.d/ubuntu.sources <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.sources <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      - name: Install cross toolchain and ARM64 dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev:arm64 \
            linux-libc-dev:arm64 \
            libx11-dev:arm64 \
            libxau-dev:arm64 \
            libxcb1-dev:arm64 \
            libxdmcp-dev:arm64

      - name: Compile TinyWM (dynamic, aarch64)
        run: |
          aarch64-linux-gnu-gcc tinywm.c -o tinywm_bin -O2 -s -lX11
          file tinywm_bin
          aarch64-linux-gnu-strip tinywm_bin || true
          ls -lh tinywm_bin

      - uses: actions/upload-artifact@v4
        with:
          name: tinywm-for-r36s
          path: tinywm_bin
