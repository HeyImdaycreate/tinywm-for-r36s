name: Compile TinyWM for R36S
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Inject ARM64 Repositories and Install Toolchain
        run: |
          # 1. Добавляем архитектуру arm64 в систему
          sudo dpkg --add-architecture arm64
          
          # 2. Переписываем список репозиториев, чтобы apt-get знал, откуда качать пакеты для ARM
          sudo tee /etc/apt/sources.list <<EOF
          deb [arch=amd64] http://ubuntu.com noble main universe restricted multiverse
          deb [arch=amd64] http://ubuntu.com noble-updates main universe restricted multiverse
          deb [arch=amd64] http://ubuntu.com noble-security main universe restricted multiverse
          deb [arch=arm64] http://ubuntu.com noble main universe restricted multiverse
          deb [arch=arm64] http://ubuntu.com noble-updates main universe restricted multiverse
          deb [arch=arm64] http://ubuntu.com noble-security main universe restricted multiverse
          EOF
          
          # 3. Обновляем кэш и ставим компилятор вместе со всеми библиотеками графики X11
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libx11-dev:arm64

      - name: Compile pure static binary
        run: |
          # Компилируем статический файл, автоматически подтягивая библиотеки из правильных папок
          aarch64-linux-gnu-gcc tinywm.c -o tinywm_bin -static -O2 -lX11 -lxcb -lXau -lXdmcp
          
      - name: Upload compiled binary to GitHub Releases
        uses: actions/upload-artifact@v4
        with:
          name: tinywm-for-r36s
          path: tinywm_bin
