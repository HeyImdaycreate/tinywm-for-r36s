name: Compile TinyWM for R36S
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Enable ARM64 Architecture and Install Packages
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libx11-dev:arm64

      - name: Compile static binary with X11
        run: |
          aarch64-linux-gnu-gcc tinywm.c -o tinywm_bin -static -lX11 -lxcb -lXau -lXdmcp

      - name: Upload compiled binary to GitHub Releases
        uses: actions/upload-artifact@v4
        with:
          name: tinywm-for-r36s
          path: tinywm_bin
